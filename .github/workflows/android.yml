name: Build Android APK
on:
  push:
    branches: [main, online-test]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare the game files (Three.js bundled so the 3D works offline)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -r audio www/audio
          cp -r models www/models
          curl -sL https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js -o www/GLTFLoader.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js#GLTFLoader.js#' www/index.html
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Use the Paperland Trails Survival app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icons/android/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/; done
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paperland-trails-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Zip the web version (index.html with Three.js bundled, plus audio)
        run: cd www && zip -qr ../PaperlandTrails-web.zip . && cd ..
      - name: Publish the APK (main = "latest" release; online-test = its own test release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PaperlandTrails.apk
          NOTES="Built from ${GITHUB_REF_NAME} commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest PaperlandTrails.apk PaperlandTrails-web.zip --title "Paperland Trails (latest build)" --notes "$NOTES" --latest
          else
            gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag || true
            gh release create "${GITHUB_REF_NAME}" PaperlandTrails.apk PaperlandTrails-web.zip --target "${GITHUB_SHA}" --title "Paperland Trails (${GITHUB_REF_NAME} test build)" --notes "$NOTES" --prerelease --latest=false
          fi
