name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare the game files (Three.js bundled so the 3D works offline)
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -r audio www/audio
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: paperland-trails-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK as the "latest" release (direct .apk download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PaperlandTrails.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PaperlandTrails.apk --title "Paperland Trails (latest build)" --notes "Built from commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" --latest
